{{ define "header" }}<div class="masthead"><h1 class="title">{{ .Title }}</h1></div>{{ end }}
{{ define "main" }}
    <div class="prose">{{ .Content }}</div>
    {{- $posts := .RegularPages.ByDate.Reverse }}
    {{ with $posts }}
    <hr class="rule">
    <section aria-labelledby="posts">
      <h2 class="label" id="posts">Posts</h2>
      <div class="entries compact">
        {{- range . }}
        <article class="entry">
          <span class="meta">{{ .Date.Format "2006" }}</span>
          <h3 class="title-line"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
          <p class="body">{{ .Params.summary | default .Description }}</p>
        </article>
        {{- end }}
      </div>
    </section>
    {{ end }}
{{ end }}
