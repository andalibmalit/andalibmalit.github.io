{{- /* Research entry. Pass (dict "page" PAGE "tier" "selected"|"list"). */ -}}
{{- $p := .page -}}
{{- $tier := .tier -}}
<article class="entry" id="{{ $p.File.ContentBaseName }}">
  <span class="meta">{{ partial "meta.html" $p }}</span>
  <h3 class="title-line">{{ $p.Title }}</h3>
  {{ if eq $tier "selected" -}}
  <div class="body">{{ $p.Content }}</div>
  {{- else -}}
  <p class="body">{{ $p.Params.summary }}</p>
  {{- end }}
  {{ partial "links.html" $p -}}
</article>
